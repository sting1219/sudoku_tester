<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>무료 온라인 스도쿠 게임</title>

    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3565697632228043" crossorigin="anonymous"></script>

    <style media="screen">
      body { background: #ECEFF1; color: rgba(0,0,0,0.87); font-family: Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
      #loading-text { text-align: center; margin-top: 100px; }
      #load { color: rgba(0,0,0,0.4); text-align: center; font-size: 13px; }
    </style>
  </head>
  <body>
    
    <div id="loading-text">
      <h1>무료 온라인 스도쿠 게임</h1>
      <p>매일 새로운 퍼즐로 두뇌를 훈련하세요. 난이도별 스도쿠 마스터.</p>
    </div>
    
    <p id="load">Firebase SDK Loading&hellip;</p>

    <script src="main.dart.js" type="application/javascript"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loadEl = document.querySelector('#load');

        // 💡 올려주신 스크린샷의 실제 키값들을 정확하게 매칭했습니다.
        const firebaseConfig = {
          apiKey: "AIzaSyDrWiInJujge-APs1dtdND-JAVWDO6ArLjQ",
          authDomain: "sudoku-tester.firebaseapp.com",
          projectId: "sudoku-tester",
          storageBucket: "sudoku-tester.appspot.com",
          messagingSenderId: "176784152",
          appId: "1:176784152:web:a979d0f0d129a0e5c8d46d",
          measurementId: "G-645WNV6DTE"
        };

        try {
          // 파이어베이스 초기화 실행
          firebase.initializeApp(firebaseConfig);
          firebase.analytics();
          
          loadEl.textContent = `Firebase SDK loaded successfully!`;
        } catch (e) {
          console.error(e);
          loadEl.textContent = 'Error loading the Firebase SDK, check the console.';
        }
      });
    </script>
  </body>
</html>
